<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOZ ICON | Glow Beyond Limits</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-brown: #2c1a12;
            --bg-overlay: rgba(44, 26, 18, 0.8);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-brown);
            color: white;
            text-align: center;
        }

        /* واجهة الدخول (Hero Section) */
        .hero {
            height: 100vh;
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://i.postimg.cc/mD8zMv7X/fgfgfg.jpg'); /* صورة الأظافر الحمراء كخلفية */
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-main {
            font-size: 3rem;
            color: var(--gold);
            letter-spacing: 5px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .slogan {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 30px;
        }

        /* شبكة الخانات (Categories) */
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px 20px;
            background: #1a0f0a;
        }

        .card {
            position: relative;
            height: 400px;
            border: 1px solid var(--gold);
            overflow: hidden;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.02);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .card-title {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 2rem;
            color: var(--gold);
            text-shadow: 2px 2px 5px black;
        }

        /* قسم التواصل والمعلومات */
        .footer-info {
            background: var(--dark-brown);
            padding: 50px 20px;
            border-top: 2px solid var(--gold);
        }

        .info-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            max-width: 1000px;
            margin: 0 auto;
        }

        .info-item {
            margin: 15px;
            min-width: 200px;
        }

        .info-item h3 { color: var(--gold); }

        .btn-insta {
            display: inline-block;
            padding: 10px 25px;
            background: var(--gold);
            color: black;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="logo-main">ZOZ ICON</div>
        <div class="slogan">GLOW BEYOND LIMITS</div>
        <p>فخامة الأظافر والرموش في مكان واحد</p>
    </section>

    <section class="categories">
        <div class="card">
            <img src="https://i.postimg.cc/0jXqQfKx/hah.jpg" alt="Nails">
            <div class="card-title">الأظافر (Nails)</div>
        </div>

        <div class="card">
            <img src="https://i.postimg.cc/7LYS0Qh0/Screenshot-2026-01-29-225915.png" alt="Lashes">
            <div class="card-title">الرموش (Lashes)</div>
        </div>
    </section>

    <footer class="footer-info">
        <div class="info-grid">
            <div class="info-item">
                <h3>📍 موقعنا</h3>
                <p>عمان - أم أذينة<br>شارع شط العرب - عمارة إمسيح</p>
            </div>
            <div class="info-item">
                <h3>📞 اتصل بنا</h3>
                <p dir="ltr">+962 7 9255 2440</p>
            </div>
            <div class="info-item">
                <h3>✨ خدماتنا</h3>
                <p>Manicure - Pedicure - Eyelashes</p>
            </div>
        </div>
        
        <a href="https://www.instagram.com/zoz_icon" class="btn-insta">تابعونا على Instagram</a>
    </footer>

</body>
</html>
